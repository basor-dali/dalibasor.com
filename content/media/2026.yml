# ============================================================================
#  MEDIA MANIFEST — 2026
# ============================================================================
#
#  One YAML file per year. This file IS the archive: plain text, diffable,
#  readable in a text editor twenty years from now with no software at all.
#  Nothing in the site reads Cloudinary directly — it reads this.
#
#  ---------------------------------------------------------------------------
#  TOP LEVEL
#  ---------------------------------------------------------------------------
#  year    Required. Must match the filename (2026.yml -> 2026).
#  note    Optional. A short hand-written line about the year. Yours to write.
#  cover   Optional. A media `id` (or a raw `publicId`) used as the year's
#          opening image. Falls back to the first image when omitted.
#  albums  Named collections within the year. May be an empty list.
#  items   Every photograph and video of the year. May be an empty list.
#
#  ---------------------------------------------------------------------------
#  ALBUM FIELDS
#  ---------------------------------------------------------------------------
#  slug      Required. Permanent URL segment: /photos/2026/<slug>.
#            Never change one after it has been published.
#  title     Required. Display name.
#  subtitle  Optional. e.g. "Summer 2026".
#  date      Optional. "2026-07" or a full date. Orders albums within the year.
#            ALWAYS QUOTE IT. An unquoted date becomes a YAML timestamp object
#            instead of a string and the ordering breaks.
#  cover     Optional. A media `id` from `items` below.
#  note      Optional. A short plain-text note. Yours to write, not generated.
#  location  Optional. Broad and manual. Never derived from GPS.
#  featured  Optional. true to surface the album on the archive index.
#
#  ---------------------------------------------------------------------------
#  ITEM FIELDS
#  ---------------------------------------------------------------------------
#  id                Stable and human-readable: "2026-serbia-0007". NEVER
#                    reused and never renumbered — it is the permalink target
#                    for a single photograph. Generated if omitted, but the
#                    generated form depends on file order, so let the importer
#                    write it and then leave it alone forever.
#  type              "image" or "video". Defaults to "image".
#  album             An album slug from above. Omit for the year's everyday
#                    photographs. An unknown slug is not fatal: the item falls
#                    back to everyday and the build logs a warning.
#  publicId          Required. The provider-side path — a Cloudinary public id,
#                    or a path under /public/media when running locally.
#  width, height     Source pixel dimensions. These reserve the frame before
#                    anything downloads, so a year of 300 photographs produces
#                    zero layout shift. Orientation is derived from them; do
#                    not state it by hand.
#  capturedAt        Local ISO capture time from EXIF. QUOTE IT. Drives
#                    chronological ordering; items without one sort by id.
#  caption           Optional, one line, written by hand. Shown under the photo.
#  alt               Alt text. Falls back to caption, then to a generic
#                    description. Write it for anything that carries meaning.
#  location          Broad and manual: "Wichita, Kansas". Never from GPS.
#  featured          true to pull it into year previews and the archive index.
#  lqip              Tiny base64 data URI painted before the image loads.
#                    Generated at import, roughly 400 bytes. If one is
#                    kilobytes long, something went wrong.
#  color             Average colour, painted before the LQIP does.
#  duration          Video only. Seconds.
#  poster            Video only. publicId of a still frame. Without one, a
#                    frame is pulled from the video itself.
#  originalFilename  Provenance. Never displayed.
#  hash              Content hash. The importer's dedupe key.
#
#  Do not hand-write `year` on an item — it comes from the filename.
#
#  ---------------------------------------------------------------------------
#  ###########    EVERYTHING BELOW IS A DEVELOPMENT PLACEHOLDER    ###########
#  ###########    DELETE ALL OF IT BEFORE THE FIRST REAL IMPORT    ###########
#  ---------------------------------------------------------------------------
#  The album and the six items below exist only to exercise the layouts:
#  album grid, everyday contact sheet, lightbox, landscape / portrait / square,
#  and video with and without a poster. The publicIds point at nothing — empty
#  image frames are expected here, and the components handle it.
#
#  Real entries are generated, never typed:
#
#      npm run media:import    read the originals, write entries into this file
#      npm run media:check     validate every manifest
#      npm run new:album       add an album to a year
#
#  To reset: delete `cover`, the one album, and all six items, leaving
#  `year: 2026` with `albums: []` and `items: []`, then run the importer.
# ============================================================================

year: 2026

# Points at a placeholder item below. Delete it with the rest.
cover: "2026-everyday-0004"

albums:
  - slug: "example-album"
    title: "Example Album"
    subtitle: "Placeholder — delete before the first import"
    date: "2026-06"
    cover: "2026-example-0001"
    location: "Wichita, Kansas"
    featured: false
    note: >-
      Example album. Everything in it is scaffolding: this note, the captions, the ids and the image paths. Delete the whole entry once real photographs are imported.

items:
